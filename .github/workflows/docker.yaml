name: Images Docker

on:
  workflow_call:
    secrets:
      DOCKERHUB_TOKEN:
        required: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: ${{ matrix.label }} - Image Docker
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: BACK
            context: ./back
            repository: bobapp-back
          - label: FRONT
            context: ./front
            repository: bobapp-front

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Vérifier la configuration de publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME"
          test -n "$DOCKERHUB_TOKEN"

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Se connecter à Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construire et éventuellement publier
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repository }}:latest
            ${{ vars.DOCKERHUB_USERNAME }}/${{ matrix.repository }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.repository }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repository }}
