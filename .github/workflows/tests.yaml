name: Workflow de tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-back:
    name: BACK-END - Tests & couverture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Configurer Java 11
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: back/pom.xml

      - name: Tester et générer JaCoCo
        run: mvn -B clean verify

      - name: Publier les résultats back
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: back-test-and-coverage
          path: |
            back/target/surefire-reports
            back/target/site/jacoco
            back/target/classes
          if-no-files-found: error
          retention-days: 14

  tests-front:
    name: FRONT-END - Tests & couverture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Configurer Node compatible Angular 14
        uses: actions/setup-node@v6
        with:
          node-version: "16.20.2"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Tester et générer LCOV
        run: npm test -- --watch=false --progress=false --browsers=ChromeHeadless --code-coverage

      - name: Publier la couverture front
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: front-coverage
          path: front/coverage/bobapp
          if-no-files-found: error
          retention-days: 14
