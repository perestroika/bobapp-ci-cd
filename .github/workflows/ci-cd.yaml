name: CI/CD BobApp

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests & qualité
    uses: ./.github/workflows/quality.yaml
    secrets: inherit

  docker:
    name: Construction & publication Docker
    needs: quality
    uses: ./.github/workflows/docker.yaml
    secrets: inherit
